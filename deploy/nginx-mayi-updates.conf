# 蚂蚁 Agent Plus 云服务器 Nginx 热更新配置模板（适配 Ubuntu Nginx 多端口环境）
# 服务器存放目录统一使用：/var/www/html/mayi-updates/

# =====================================================================
# 方式 A（推荐，免开新安全组端口）：直接塞进你现有的 listen 80 块中（与 dify 完全互不干扰）
# 更新源地址填：http://你的服务器公网IP/mayi-updates/
# =====================================================================
# 在你的 listen 80 的 server { ... } 里，放在 location / 上面新增这一段：

    location ^~ /mayi-updates/ {
        root /var/www/html;
        index index.html;
        sendfile on;
        tcp_nopush on;
        max_ranges 256;

        # latest.yml 严禁缓存，确保你一发新版本客户端立刻能检测到
        if ($request_uri ~* "\.yml(\?.*)?$") {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }
    }


# =====================================================================
# 方式 B（按你现有的多端口习惯独立一个端口，例如 8090）：直接贴在 default.conf 最底部
# 注意：需在腾讯云控制台【防火墙/安全组】放行 TCP 8090 端口
# 更新源地址填：http://你的服务器公网IP:8090/
# =====================================================================
server {
    listen 8090;
    server_name _;

    root /var/www/html/mayi-updates;
    index index.html;

    sendfile on;
    tcp_nopush on;
    max_ranges 256;

    location / {
        try_files $uri $uri/ =404;
    }

    # 关键：禁止缓存 latest.yml，防止发版后客户端读到旧版本号
    location ~* \.yml$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        expires -1;
    }

    # 安装包与差分包开启分片支持（支撑几 MB 增量下载）
    location ~* \.(exe|blockmap)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Accept-Ranges bytes always;
    }
}
