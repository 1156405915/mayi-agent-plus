# 蚂蚁 Agent Plus 自有云服务器 Nginx / 宝塔面板热更新托管配置模板
# 将编译生成的 release/ 下的 4 个文件上传至服务器 /var/www/mayi-updates/ 目录即可：
#   - mayi-agent-plus-setup-x.y.z.exe
#   - mayi-agent-plus-setup-x.y.z.exe.blockmap
#   - index.html
#   - latest.yml（每次发版请最后覆盖此文件）

server {
    listen 80;
    # 如已申请 SSL 证书（强烈建议生产使用 HTTPS），取消下方两行注释并填写证书路径：
    # listen 443 ssl http2;
    # ssl_certificate /etc/nginx/ssl/your-domain.pem;
    # ssl_certificate_key /etc/nginx/ssl/your-domain.key;

    server_name updates.your-domain.com; # 替换为你的域名或服务器公网 IP

    # 方式 A：使用子目录 /mayi-updates/ 挂载（对应 publish.url: "https://你的域名/mayi-updates/"）
    location /mayi-updates/ {
        alias /var/www/mayi-updates/;
        index index.html;

        # 开启高效文件传输与 HTTP Range 断点/分片请求（electron-updater blockmap 差分下载必需！）
        sendfile on;
        tcp_nopush on;
        max_ranges 256;

        # 关键防坑 1：严禁缓存 latest.yml，否则你发了新版本，客户端读到的还是旧缓存！
        location ~* \.yml$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires -1;
        }

        # 关键防坑 2：带版本号的 .exe 和 .blockmap 文件名每次发版都会变，可安全开启长缓存加速下载
        location ~* \.(exe|blockmap)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Accept-Ranges bytes;
        }
    }
}
